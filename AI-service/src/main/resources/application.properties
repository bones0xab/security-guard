spring.application.name=AI-service
server.port=1337


spring.datasource.url=jdbc:postgresql://ms-postgres:5432/db_ai
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver


spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.max-document-batch-size=100

#second test
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=llama3-70b-8192



#spring.ai.ollama.base-url=http://host.docker.internal:11434
#spring.ai.ollama.chat.model=phi3:mini
#spring.ai.embedding.ollama.options.model=mxbai-embed-large
spring.ai.chat.client.enabled=true