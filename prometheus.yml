global:
  scrape_interval: 15s
  evaluation_interval: 15s


scrape_configs:
  - job_name: "Gateway Service"
    scrape_interval: 10s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:8080"]
        labels:
            app: "gateway-service"
            env: "production"
