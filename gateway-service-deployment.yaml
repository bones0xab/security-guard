apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\bin\kompose.exe convert -f .\docker-compose.yml
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: gateway-service
  name: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: gateway-service
  template:
    metadata:
      annotations:
        kompose.cmd: C:\bin\kompose.exe convert -f .\docker-compose.yml
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: gateway-service
    spec:
      containers:
        - env:
            - name: KEYCLOAK_URL
              value: http://ms-keycloak:9090
            - name: SERVER_PORT
              value: "8080"
          image: gateway-service
          name: ms-gateway
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
