apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      name: product-service
      labels:
        app: product-service
    spec:
      imagePullSecrets:
        - name: ocir-secret
      containers:
        - name: product-service
          image: eu-paris-1.ocir.io/axq1vfktkjkq/ms-product:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              protocol: TCP

          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/db_product"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
      restartPolicy: Always
      