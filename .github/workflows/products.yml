name: products.yml
on:
  push:
    paths:
        - 'produit-service/**'
  pull_request:
    paths:
        - 'produit-service/**'

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Set up JDK 17
          uses: actions/setup-java@v3
          with:
            java-version: '17'
            distribution: 'temurin'

        - name: Build with Maven
          run: mvn -f produit-service/pom.xml clean install

        - name: Run tests
          run: mvn -f produit-service/pom.xml test