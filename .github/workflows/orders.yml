name: orders.yml
on:
  push:
    paths:
        - 'order-service/**'
  pull_request:
    paths:
        - 'order-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name : Check the code
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -f order-service/pom.xml clean install

      - name: Run tests
        run: mvn -f order-service/pom.xml test
