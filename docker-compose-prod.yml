version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ms-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_MULTIPLE_DATABASES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.1
    container_name: ms-keycloak
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HTTP_PORT=${KC_HTTP_PORT}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_PROXY=edge
    command: ["start-dev", "--http-port=9090"]
    ports:
      - "9090:9090"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ms-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  product-service:
    image: 0xbones1/ms-product:main
    container_name: ms-product
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=${PRODUCT_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${PRODUCT_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${PRODUCT_DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_JWKS_URI=${KEYCLOAK_JWKS_URI}
    depends_on:
      - postgres
      - keycloak

  order-service:
    image: 0xbones1/ms-order:main
    container_name: ms-order
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=${ORDER_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${ORDER_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${ORDER_DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_JWKS_URI=${KEYCLOAK_JWKS_URI}
    depends_on:
      - postgres
      - keycloak

  gateway-service:
    image: 0xbones1/ms-gateway:main
    container_name: ms-gateway
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_JWKS_URI=${KEYCLOAK_JWKS_URI}
    depends_on:
      - product-service
      - order-service
      - keycloak

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: ms-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9095:9090"
    restart: unless-stopped
    depends_on:
      - gateway-service


volumes:
  pgadmin_data:
  postgres_data:
  prometheus_data: